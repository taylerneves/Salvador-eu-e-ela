<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nosso Livro de Aventuras — Salvador, Bahia</title>

  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Caveat:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="scene">
  <div id="book">
    <div id="lp"><div id="lc"></div></div>

    <div id="sp"></div>

    <div id="rp">
      <div id="rc"></div>
      <div id="edges"></div>
    </div>

    <div id="flipper">
      <div class="ff"><div id="ffc"></div></div>
      <div class="fb2"><div id="fbc"></div></div>
    </div>
  </div>
</div>

<!-- COVER -->
<div id="cover-wrap" onclick="openCover()">
  <div class="cv-front">
    <div class="cv-border"></div>
    <div class="cv-border2"></div>

    <div class="cv-sub">✈ Salvador · Bahia · Brasil</div>

    <div class="cv-title">
      Nosso Livro<br>
      de <em>Aventuras</em>
    </div>

    <div class="cv-date">5 – 12 de Agosto de 2024</div>

    <div class="cv-fitas">
      <div class="cfb" style="background:var(--am);width:44px;"></div>
      <div class="cfb" style="background:var(--vd);width:62px;"></div>
      <div class="cfb" style="background:var(--az);width:48px;"></div>
      <div class="cfb" style="background:var(--vm);width:56px;"></div>
      <div class="cfb" style="background:var(--ro);width:40px;"></div>
    </div>

    <div class="cv-hint">▸ clique para abrir o livro</div>
  </div>

  <div class="cv-back"></div>
</div>

<button class="arr" id="bp" onclick="turn(-1)" disabled>&#8249;</button>
<button class="arr" id="bn" onclick="turn(1)" disabled>&#8250;</button>

<div id="ht">Salvador, Bahia · Agosto 2024</div>
<div id="hc2"></div>

<script src="script.js"></script>
</body>
</html>
